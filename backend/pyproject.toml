[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geofoncier-backend"
version = "0.1.0"
description = "API REST de gestion de parcelles cadastrales avec FastAPI et PostGIS"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "SQLAlchemy==2.0.43",
  "geoalchemy2==0.18.0",
  "alembic==1.16.4",
  "psycopg[binary]==3.2.10",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "httpx==0.28.1",
  "ruff==0.12.8",
  "mypy==1.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
